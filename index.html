<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PizzaOS - Sistema Completo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Space Mono', monospace; }
        
        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animações */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Estilo Cupom Fiscal Visual (Tela) */
        .receipt-tear {
            background-image: radial-gradient(circle at bottom, transparent 6px, #fff 7px);
            background-size: 20px 20px;
            background-position: bottom;
            background-repeat: repeat-x;
            height: 20px;
            margin-bottom: -10px;
            position: relative;
            z-index: 10;
        }

        /* Input PIN */
        .pin-input {
            letter-spacing: 0.5em;
            text-align: center;
            font-size: 1.5rem;
        }

        /* CONFIGURAÇÃO DE IMPRESSÃO (Cupom Térmico) */
        @media print {
            body * {
                visibility: hidden;
            }
            #modal, #modal * {
                visibility: visible;
            }
            #modal {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background: white;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding: 0;
                margin: 0;
                z-index: 9999;
            }
            #modal-content {
                width: 80mm; /* Largura padrão de impressora térmica */
                padding: 0;
                box-shadow: none;
                border: none;
            }
            .no-print {
                display: none !important;
            }
            /* Ajustes para economia de tinta e legibilidade */
            .bg-yellow-50 { background: white !important; }
            .text-gray-800, .text-gray-500 { color: black !important; }
            .receipt-tear { display: none; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- BARRA DE NAVEGAÇÃO / ROLE SWITCHER -->
    <nav class="bg-gray-900 text-white shadow-lg z-50 no-print">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2" onclick="app.router.go('home')">
                <i class="fa-solid fa-pizza-slice text-yellow-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-tight cursor-pointer">Pizza<span class="text-yellow-500">OS</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:flex text-xs bg-gray-800 rounded-lg p-1">
                    <button onclick="app.auth.requestAccess('customer')" id="role-customer" class="role-btn px-3 py-1 rounded transition">Cliente</button>
                    <button onclick="app.auth.requestAccess('counter')" id="role-counter" class="role-btn px-3 py-1 rounded transition flex items-center gap-1"><i class="fa-solid fa-lock text-[10px] opacity-50"></i> PDV</button>
                    <button onclick="app.auth.requestAccess('kitchen')" id="role-kitchen" class="role-btn px-3 py-1 rounded transition flex items-center gap-1"><i class="fa-solid fa-lock text-[10px] opacity-50"></i> Cozinha</button>
                    <button onclick="app.auth.requestAccess('admin')" id="role-admin" class="role-btn px-3 py-1 rounded transition flex items-center gap-1"><i class="fa-solid fa-lock text-[10px] opacity-50"></i> Admin</button>
                </div>
                
                <!-- Info do Usuário Logado -->
                <div id="user-info" class="hidden text-xs text-yellow-500 font-bold border border-yellow-500 px-2 py-1 rounded"></div>

                <!-- Carrinho -->
                <button onclick="app.toggleCart()" class="relative p-2 hover:bg-gray-800 rounded-full transition cart-trigger">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-600 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full animate-bounce">0</span>
                </button>
            </div>
        </div>
        <!-- Mobile Role Switcher -->
        <div class="md:hidden flex overflow-x-auto p-2 bg-gray-800 gap-2 text-xs">
            <button onclick="app.auth.requestAccess('customer')" class="role-btn whitespace-nowrap px-3 py-1 bg-gray-700 rounded text-white">Cliente</button>
            <button onclick="app.auth.requestAccess('counter')" class="role-btn whitespace-nowrap px-3 py-1 bg-gray-700 rounded text-white"><i class="fa-solid fa-lock text-[10px]"></i> PDV</button>
            <button onclick="app.auth.requestAccess('kitchen')" class="role-btn whitespace-nowrap px-3 py-1 bg-gray-700 rounded text-white"><i class="fa-solid fa-lock text-[10px]"></i> KDS</button>
            <button onclick="app.auth.requestAccess('admin')" class="role-btn whitespace-nowrap px-3 py-1 bg-gray-700 rounded text-white"><i class="fa-solid fa-lock text-[10px]"></i> Admin</button>
        </div>
    </nav>

    <!-- CONTAINER PRINCIPAL -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 md:p-6 relative">
        <!-- O conteúdo será injetado aqui via JS -->
    </main>

    <!-- FOOTER SOCIAL -->
    <footer class="bg-white border-t p-4 text-center text-sm text-gray-500 no-print">
        <div class="flex justify-center gap-6 mb-2">
            <a href="#" class="text-gray-400 hover:text-red-600 transition text-xl"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="text-gray-400 hover:text-green-600 transition text-xl"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#" class="text-gray-400 hover:text-blue-600 transition text-xl"><i class="fa-brands fa-facebook"></i></a>
        </div>
        <p>&copy; 2025 PizzaOS - O melhor pedaço do seu dia.</p>
    </footer>

    <!-- SIDEBAR CARRINHO -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col no-print">
        <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-receipt text-gray-500"></i> Pedido Atual
            </h2>
            <button onclick="app.toggleCart()" class="text-gray-500 hover:text-red-500">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>
        
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Itens do carrinho -->
            <div class="text-center text-gray-500 mt-10">Carrinho vazio</div>
        </div>

        <div class="p-4 bg-gray-50 border-t space-y-3">
            <div class="flex justify-between text-lg font-bold">
                <span>Total</span>
                <span id="cart-total">R$ 0,00</span>
            </div>
            <!-- Correção aqui: toggleCart() fecha o carrinho para mostrar a tela de checkout no mobile -->
            <button onclick="app.toggleCart(); app.router.go('checkout')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition flex items-center justify-center gap-2">
                Finalizar Pedido <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>
    <div id="cart-overlay" onclick="app.toggleCart()" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 no-print"></div>

    <!-- MODAL GENÉRICO -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-75 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto relative animate-fade-in" id="modal-container">
            <!-- Botão de Fechar Geral (Será ocultado no recibo) -->
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600 p-2 z-10 no-print" id="modal-close-btn">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- 1. MOCK DATA & STORAGE ---
        const DB = {
            init() {
                // Produtos Iniciais
                if (!localStorage.getItem('pizzaos_products')) {
                    const initialProducts = [
                        { id: 1, name: 'Calabresa Especial', desc: 'Mussarela, calabresa artesanal, cebola roxa e azeitonas.', price: 45.00, category: 'Salgada', image: 'https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?q=80&w=600&auto=format&fit=crop' },
                        { id: 2, name: 'Marguerita Premium', desc: 'Tomates frescos, bocconcini de búfala e manjericão.', price: 42.00, category: 'Vegetariana', image: 'https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?q=80&w=600&auto=format&fit=crop' },
                        { id: 3, name: 'Frango Catupiry', desc: 'Frango desfiado temperado e Catupiry original.', price: 48.00, category: 'Salgada', image: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?q=80&w=600&auto=format&fit=crop' },
                        { id: 4, name: 'Quatro Queijos', desc: 'Gorgonzola, parmesão, provolone e mussarela.', price: 50.00, category: 'Salgada', image: 'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?q=80&w=600&auto=format&fit=crop' },
                        { id: 5, name: 'Chocolate com Morango', desc: 'Ganache de chocolate meio amargo com morangos frescos.', price: 38.00, category: 'Doce', image: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=600&auto=format&fit=crop' },
                        { id: 6, name: 'Coca-Cola 2L', desc: 'Refrigerante gelado.', price: 12.00, category: 'Bebida', image: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?q=80&w=600&auto=format&fit=crop' },
                        { id: 7, name: 'Suco de Laranja 500ml', desc: 'Suco natural da fruta, feito na hora.', price: 10.00, category: 'Bebida', image: 'https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?q=80&w=600&auto=format&fit=crop' }
                    ];
                    localStorage.setItem('pizzaos_products', JSON.stringify(initialProducts));
                }
                // Pedidos Iniciais
                if (!localStorage.getItem('pizzaos_orders')) {
                    localStorage.setItem('pizzaos_orders', JSON.stringify([]));
                }
                // Funcionários Iniciais
                if (!localStorage.getItem('pizzaos_employees')) {
                    const initialEmployees = [
                        { id: 1, name: 'Administrador', role: 'admin', pin: '9999' },
                        { id: 2, name: 'Chef Mario', role: 'kitchen', pin: '1111' },
                        { id: 3, name: 'Atendente Julia', role: 'counter', pin: '2222' }
                    ];
                    localStorage.setItem('pizzaos_employees', JSON.stringify(initialEmployees));
                }
                // Configurações
                if (!localStorage.getItem('pizzaos_settings')) {
                    const defaultSettings = {
                        methods: { cash: true, card: true, pix: true, crypto: true },
                        pix: { mode: 'manual', key: '00.000.000/0001-90', apiKey: '', apiSecret: '' },
                        crypto: { wallet: 'TQn9Y2kh7....sJ8d7S' },
                        gateway: { provider: 'mercadopago', publicKey: '', secretKey: '' }
                    };
                    localStorage.setItem('pizzaos_settings', JSON.stringify(defaultSettings));
                }
            },
            getProducts() { return JSON.parse(localStorage.getItem('pizzaos_products')); },
            getOrders() { return JSON.parse(localStorage.getItem('pizzaos_orders')); },
            getEmployees() { return JSON.parse(localStorage.getItem('pizzaos_employees')); },
            getSettings() { return JSON.parse(localStorage.getItem('pizzaos_settings')); },
            
            saveOrder(order) {
                const orders = this.getOrders();
                orders.push(order);
                localStorage.setItem('pizzaos_orders', JSON.stringify(orders));
                return order;
            },
            updateOrderStatus(id, status) {
                const orders = this.getOrders();
                const idx = orders.findIndex(o => o.id === id);
                if (idx !== -1) {
                    orders[idx].status = status;
                    localStorage.setItem('pizzaos_orders', JSON.stringify(orders));
                }
            },
            saveProduct(product) {
                let list = this.getProducts();
                if(product.id) {
                    const idx = list.findIndex(p => p.id === parseInt(product.id));
                    if(idx !== -1) list[idx] = { ...list[idx], ...product, id: parseInt(product.id) };
                    else list.push({ ...product, id: Date.now() });
                } else {
                    product.id = Date.now();
                    list.push(product);
                }
                localStorage.setItem('pizzaos_products', JSON.stringify(list));
            },
            deleteProduct(id) {
                let products = this.getProducts();
                products = products.filter(p => p.id !== id);
                localStorage.setItem('pizzaos_products', JSON.stringify(products));
            },
            saveEmployee(emp) {
                let list = this.getEmployees();
                if(emp.id) {
                    const idx = list.findIndex(e => e.id === parseInt(emp.id));
                    if(idx !== -1) list[idx] = { ...list[idx], ...emp, id: parseInt(emp.id) };
                    else list.push({ ...emp, id: Date.now() });
                } else {
                    emp.id = Date.now();
                    list.push(emp);
                }
                localStorage.setItem('pizzaos_employees', JSON.stringify(list));
            },
            deleteEmployee(id) {
                let list = this.getEmployees().filter(e => e.id !== id);
                localStorage.setItem('pizzaos_employees', JSON.stringify(list));
            },
            saveSettings(settings) {
                localStorage.setItem('pizzaos_settings', JSON.stringify(settings));
            }
        };

        // --- 2. STATE MANAGEMENT ---
        const app = {
            currentRole: 'customer',
            currentUser: null, 
            activeCategory: 'all',
            cart: [],
            
            init() {
                DB.init();
                this.loadCart();
                this.setRole('customer');
            },

            // --- AUTH SYSTEM ---
            auth: {
                requestAccess(role) {
                    if (role === 'customer') {
                        app.setRole('customer');
                        app.currentUser = null;
                        document.getElementById('user-info').classList.add('hidden');
                        return;
                    }
                    this.showLoginModal(role);
                },
                showLoginModal(role) {
                    const modal = document.getElementById('modal');
                    // Ensure close button is visible for login
                    const closeBtn = document.getElementById('modal-close-btn');
                    if(closeBtn) closeBtn.classList.remove('hidden');

                    const content = document.getElementById('modal-content');
                    const roleNames = { 'admin': 'Admin', 'kitchen': 'Cozinha', 'counter': 'Balcão' };
                    
                    content.innerHTML = `
                        <div class="p-8 text-center">
                            <div class="mb-6">
                                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i class="fa-solid fa-lock text-2xl text-gray-600"></i>
                                </div>
                                <h3 class="text-xl font-bold text-gray-800">Acesso Restrito</h3>
                                <p class="text-sm text-gray-500">Digite o PIN para entrar como <span class="font-bold">${roleNames[role]}</span></p>
                            </div>
                            <form onsubmit="event.preventDefault(); app.auth.verifyPin('${role}')">
                                <input type="password" id="access-pin" maxlength="4" class="pin-input w-full p-3 border-2 border-gray-300 rounded-lg mb-4 focus:border-red-500 focus:outline-none" placeholder="••••" autofocus>
                                <div id="pin-error" class="hidden text-red-500 text-sm mb-4 font-bold">PIN Incorreto</div>
                                <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3 rounded-lg hover:bg-black transition">ENTRAR</button>
                            </form>
                            <div class="mt-4 text-xs text-gray-400">Padrão: Cozinha(1111), Balcão(2222), Admin(9999)</div>
                        </div>
                    `;
                    modal.classList.remove('hidden');
                    setTimeout(() => document.getElementById('access-pin').focus(), 100);
                },
                verifyPin(role) {
                    const input = document.getElementById('access-pin');
                    const error = document.getElementById('pin-error');
                    const employees = DB.getEmployees();
                    
                    const employee = employees.find(e => e.role === role && e.pin === input.value);

                    if (employee) {
                        app.currentUser = employee;
                        app.setRole(role);
                        document.getElementById('modal').classList.add('hidden');
                        
                        // Mostrar quem está logado
                        const userInfo = document.getElementById('user-info');
                        userInfo.innerText = employee.name;
                        userInfo.classList.remove('hidden');
                    } else {
                        error.classList.remove('hidden');
                        input.value = '';
                        input.classList.add('border-red-500', 'animate-pulse');
                        setTimeout(() => input.classList.remove('border-red-500', 'animate-pulse'), 1000);
                    }
                }
            },

            setRole(role) {
                this.currentRole = role;
                document.querySelectorAll('.role-btn').forEach(btn => {
                    btn.classList.remove('bg-yellow-500', 'text-black', 'font-bold');
                    btn.classList.add('text-white');
                    const btnText = btn.innerText.toLowerCase();
                    const targetText = role === 'counter' ? 'pdv' : role === 'kitchen' ? 'kds' : role === 'customer' ? 'cliente' : 'admin';
                    if(btnText.includes(targetText.toLowerCase())) {
                         btn.classList.add('bg-yellow-500', 'text-black', 'font-bold');
                         btn.classList.remove('text-white');
                    }
                });
                if (role === 'kitchen') this.router.go('kds');
                else if (role === 'admin') this.router.go('admin');
                else this.router.go('home');
            },

            setCategory(cat) {
                this.activeCategory = cat;
                this.router.go('home');
            },

            addToCart(productId) {
                const product = DB.getProducts().find(p => p.id === productId);
                const existing = this.cart.find(item => item.id === productId);
                if (existing) { existing.qty++; } else { this.cart.push({ ...product, qty: 1 }); }
                this.saveCart();
                this.updateCartUI();
                const btn = document.getElementById(`btn-add-${productId}`);
                if(btn) {
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Adicionado';
                    btn.classList.add('bg-green-600', 'hover:bg-green-700');
                    btn.classList.remove('bg-red-600', 'hover:bg-red-700');
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                        btn.classList.add('bg-red-600', 'hover:bg-red-700');
                    }, 1000);
                }
            },
            removeFromCart(productId) {
                this.cart = this.cart.filter(p => p.id !== productId);
                this.saveCart();
                this.updateCartUI();
                if(document.getElementById('checkout-summary')) this.router.views.checkout(); 
            },
            changeQty(productId, delta) {
                const item = this.cart.find(p => p.id === productId);
                if (item) {
                    item.qty += delta;
                    if (item.qty <= 0) this.removeFromCart(productId);
                    else this.saveCart();
                }
                this.updateCartUI();
                if(document.getElementById('checkout-summary')) this.router.views.checkout();
            },
            saveCart() { localStorage.setItem('pizzaos_cart', JSON.stringify(this.cart)); },
            loadCart() { this.cart = JSON.parse(localStorage.getItem('pizzaos_cart') || '[]'); this.updateCartUI(); },
            updateCartUI() {
                const count = this.cart.reduce((acc, item) => acc + item.qty, 0);
                const total = this.cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
                const countBadge = document.getElementById('cart-count');
                if(countBadge) countBadge.innerText = count;
                const totalDisplay = document.getElementById('cart-total');
                if(totalDisplay) totalDisplay.innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                
                const container = document.getElementById('cart-items');
                if(container) {
                    if (this.cart.length === 0) {
                        container.innerHTML = '<div class="text-center text-gray-400 mt-10"><i class="fa-solid fa-basket-shopping text-4xl mb-2"></i><p>Carrinho vazio</p></div>';
                        return;
                    }
                    container.innerHTML = this.cart.map(item => `
                        <div class="flex items-center gap-3 bg-white p-2 rounded shadow-sm border border-gray-100">
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                                <p class="text-xs text-gray-500">${item.price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })} un</p>
                            </div>
                            <div class="flex items-center gap-2 bg-gray-100 rounded px-2">
                                <button onclick="app.changeQty(${item.id}, -1)" class="text-red-500 font-bold">-</button>
                                <span class="text-sm font-bold w-4 text-center">${item.qty}</span>
                                <button onclick="app.changeQty(${item.id}, 1)" class="text-green-500 font-bold">+</button>
                            </div>
                        </div>
                    `).join('');
                }
            },
            toggleCart() {
                const sidebar = document.getElementById('cart-sidebar');
                const overlay = document.getElementById('cart-overlay');
                if (sidebar.classList.contains('translate-x-full')) {
                    sidebar.classList.remove('translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('translate-x-full');
                    overlay.classList.add('hidden');
                }
            },
            clearCart() { this.cart = []; this.saveCart(); this.updateCartUI(); },

            // --- ROUTER ---
            router: {
                go(viewName) {
                    const content = document.getElementById('app-content');
                    content.innerHTML = ''; 
                    window.scrollTo(0,0);
                    if (this.views[viewName]) {
                        content.innerHTML = this.views[viewName]();
                        this.initScripts(viewName);
                    } else {
                        content.innerHTML = '<h2 class="text-red-500">Erro 404: Página não encontrada</h2>';
                    }
                },
                initScripts(viewName) {
                    if(viewName === 'checkout') app.checkoutLogic.init();
                    if(viewName === 'kds') app.kdsLogic.init();
                    if(viewName === 'admin') app.adminLogic.init();
                },
                views: {
                    home: () => {
                        let products = DB.getProducts();
                        
                        if (app.activeCategory !== 'all') {
                            products = products.filter(p => {
                                if (app.activeCategory === 'Salgada') return p.category === 'Salgada' || p.category === 'Vegetariana';
                                return p.category === app.activeCategory;
                            });
                        }

                        const getBtnClass = (cat) => app.activeCategory === cat 
                            ? 'bg-red-600 text-white shadow-md transform scale-105' 
                            : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200';

                        return `
                            <div class="fade-in max-w-6xl mx-auto pb-10">
                                ${app.currentRole === 'counter' 
                                ? `<div class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 mb-6" role="alert">
                                    <p class="font-bold">Modo PDV Ativo</p>
                                    <p>Selecione os itens abaixo para montar o pedido do cliente no balcão.</p>
                                   </div>` 
                                : `<div class="relative bg-gray-900 rounded-2xl overflow-hidden mb-8 shadow-xl h-64 md:h-80">
                                    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1200" class="w-full h-full object-cover opacity-60">

                                        <div class="bg-white rounded-lg shadow-md p-6 border border-gray-100">
                                            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                                                <i class="fa-solid fa-wallet text-purple-600"></i> Métodos de Pagamento
                                            </h3>
                                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                                <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                                    <input type="checkbox" name="method_cash" ${settings.methods.cash ? 'checked' : ''} class="w-5 h-5 text-green-600">
                                                    <span>Dinheiro</span>
                                                </label>
                                                <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                                    <input type="checkbox" name="method_card" ${settings.methods.card ? 'checked' : ''} class="w-5 h-5 text-blue-600">
                                                    <span>Cartão (Online/Maquininha)</span>
                                                </label>
                                                <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                                    <input type="checkbox" name="method_pix" ${settings.methods.pix ? 'checked' : ''} class="w-5 h-5 text-teal-600">
                                                    <span>Pix</span>
                                                </label>
                                                <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                                    <input type="checkbox" name="method_crypto" ${settings.methods.crypto ? 'checked' : ''} class="w-5 h-5 text-yellow-600">
                                                    <span>Cripto (USDT)</span>
                                                </label>
                                            </div>
                                        </div>

                                        <!-- Gateway de Pagamento (Novo) -->
                                        <div class="bg-white rounded-lg shadow-md p-6 border border-gray-100">
                                            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                                                <i class="fa-regular fa-credit-card text-blue-600"></i> Gateway de Pagamento (Cartão)
                                            </h3>
                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div class="md:col-span-2">
                                                    <label class="block text-sm font-bold text-gray-700 mb-2">Provedor</label>
                                                    <select name="gateway_provider" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-200 outline-none bg-white">
                                                        <option value="mercadopago" ${settings.gateway.provider === 'mercadopago' ? 'selected' : ''}>Mercado Pago</option>
                                                        <option value="stripe" ${settings.gateway.provider === 'stripe' ? 'selected' : ''}>Stripe</option>
                                                        <option value="asaas" ${settings.gateway.provider === 'asaas' ? 'selected' : ''}>Asaas</option>
                                                        <option value="pagarme" ${settings.gateway.provider === 'pagarme' ? 'selected' : ''}>Pagar.me</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label class="block text-sm font-bold text-gray-700 mb-2">Public Key / Chave Pública</label>
                                                    <input type="text" name="gateway_public" value="${settings.gateway.publicKey}" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-200 outline-none" placeholder="Ex: pk_test_...">
                                                </div>
                                                <div>
                                                    <label class="block text-sm font-bold text-gray-700 mb-2">Secret Key / Token Privado</label>
                                                    <input type="password" name="gateway_secret" value="${settings.gateway.secretKey}" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-200 outline-none" placeholder="Ex: sk_test_...">
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Configuração Pix -->
                                        <div class="bg-white rounded-lg shadow-md p-6 border border-gray-100">
                                            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                                                <i class="fa-brands fa-pix text-teal-600"></i> Configuração Pix
                                            </h3>
                                            <div class="mb-4">
                                                <label class="block text-sm font-bold text-gray-700 mb-2">Modo de Operação</label>
                                                <div class="flex gap-4">
                                                    <label class="flex items-center gap-2">
                                                        <input type="radio" name="pix_mode" value="manual" ${settings.pix.mode === 'manual' ? 'checked' : ''} onchange="app.adminLogic.togglePixMode(this.value)">
                                                        Chave Manual (Estática)
                                                    </label>
                                                    <label class="flex items-center gap-2">
                                                        <input type="radio" name="pix_mode" value="api" ${settings.pix.mode === 'api' ? 'checked' : ''} onchange="app.adminLogic.togglePixMode(this.value)">
                                                        API Integrada (Dinâmica)
                                                    </label>
                                                </div>
                                            </div>

                                            <div id="pix-manual-config" class="${settings.pix.mode === 'manual' ? '' : 'hidden'}">
                                                <label class="block text-sm font-bold text-gray-700 mb-2">Chave Pix (CPF, CNPJ, Email, Aleatória)</label>
                                                <input type="text" name="pix_key" value="${settings.pix.key}" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-teal-200 outline-none" placeholder="Ex: 12.345.678/0001-90">
                                            </div>

                                            <div id="pix-api-config" class="${settings.pix.mode === 'api' ? '' : 'hidden'} space-y-4">
                                                <div>
                                                    <label class="block text-sm font-bold text-gray-700 mb-2">Client ID (API)</label>
                                                    <input type="text" name="pix_api_key" value="${settings.pix.apiKey}" class="w-full p-3 border rounded-lg bg-gray-50" placeholder="Insira o Client ID">
                                                </div>
                                                <div>
                                                    <label class="block text-sm font-bold text-gray-700 mb-2">Client Secret (API)</label>
                                                    <input type="password" name="pix_api_secret" value="${settings.pix.apiSecret}" class="w-full p-3 border rounded-lg bg-gray-50" placeholder="Insira o Client Secret">
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Configuração Cripto -->
                                        <div class="bg-white rounded-lg shadow-md p-6 border border-gray-100">
                                            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                                                <i class="fa-brands fa-bitcoin text-yellow-600"></i> Configuração Cripto (USDT)
                                            </h3>
                                            <div>
                                                <label class="block text-sm font-bold text-gray-700 mb-2">Endereço da Carteira (Rede TRC20)</label>
                                                <input type="text" name="crypto_wallet" value="${settings.crypto.wallet}" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-yellow-200 outline-none font-mono text-sm" placeholder="Ex: TQn9Y2kh7....">
                                            </div>
                                        </div>

                                        <div class="flex justify-end">
                                            <button type="submit" class="bg-green-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-green-700 shadow-lg transition transform hover:-translate-y-1">
                                                Salvar Configurações
                                            </button>
                                        </div>
                                    </form>
                                </div>

                            </div>
                        `;
                    }
                }
            },

            // --- VIEW SPECIFIC LOGIC ---
            checkoutLogic: {
                init() { this.toggleAddress(true); },
                toggleAddress(isDelivery) {
                    const el = document.getElementById('address-section');
                    if(el) {
                        if (isDelivery) {
                            el.classList.remove('hidden');
                            el.querySelectorAll('input').forEach(i => i.required = true);
                        } else {
                            el.classList.add('hidden');
                            el.querySelectorAll('input').forEach(i => i.required = false);
                        }
                    }
                },
                handlePaymentChange(method) {
                    const cash = document.getElementById('cash-change');
                    const crypto = document.getElementById('crypto-wallet');
                    const pix = document.getElementById('pix-area');
                    const card = document.getElementById('card-area');
                    
                    if(cash) cash.classList.add('hidden');
                    if(crypto) crypto.classList.add('hidden');
                    if(pix) pix.classList.add('hidden');
                    if(card) card.classList.add('hidden');

                    if (method === 'cash' && cash) cash.classList.remove('hidden');
                    if (method === 'crypto' && crypto) crypto.classList.remove('hidden');
                    if (method === 'pix' && pix) pix.classList.remove('hidden');
                    if (method === 'card' && card) card.classList.remove('hidden');
                },
                placeOrder() {
                    const name = document.getElementById('custName').value;
                    const phone = document.getElementById('custPhone').value;
                    const orderType = document.querySelector('input[name="orderType"]:checked').value;
                    const paymentSelect = document.getElementById('paymentMethod');
                    
                    if (!name || !phone) return alert('Por favor, preencha nome e telefone.');
                    if (orderType === 'delivery' && !document.getElementById('addrStreet').value) return alert('Endereço é obrigatório para delivery.');
                    if (!paymentSelect.value) return alert('Selecione uma forma de pagamento.');

                    const order = {
                        id: Math.floor(1000 + Math.random() * 9000),
                        customer: { name, phone },
                        items: app.cart,
                        total: app.cart.reduce((a, b) => a + (b.price * b.qty), 0),
                        type: orderType,
                        payment: paymentSelect.value,
                        address: orderType === 'delivery' ? `${document.getElementById('addrStreet').value}, ${document.getElementById('addrNum').value}` : null,
                        status: 'received',
                        attendant: app.currentUser ? app.currentUser.name : 'Autoatendimento', // Campo novo: Atendente
                        time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
                    };
                    DB.saveOrder(order);
                    app.clearCart();
                    this.showReceipt(order);
                },
                
                // NOVA LÓGICA PARA FECHAR RECIBO E IR PARA HOME
                finishOrder() {
                    // Restaura botão de fechar global se estiver oculto
                    const closeBtn = document.getElementById('modal-close-btn');
                    if(closeBtn) closeBtn.classList.remove('hidden');
                    
                    // Fecha modal
                    document.getElementById('modal').classList.add('hidden');
                    
                    // Navega para Home
                    app.router.go('home');
                },

                showReceipt(order) {
                    const modal = document.getElementById('modal');
                    const content = document.getElementById('modal-content');
                    
                    // Esconde botão "X" global para evitar fechar sem completar o fluxo
                    const closeBtn = document.getElementById('modal-close-btn');
                    if(closeBtn) closeBtn.classList.add('hidden');
                    
                    // Traduções de Pagamento
                    const payMap = { 
                        'pix': 'PIX', 'cash': 'DINHEIRO', 'card': 'CARTÃO', 'crypto': 'CRIPTO (USDT)' 
                    };

                    content.innerHTML = `
                        <div class="bg-yellow-50 p-6 text-gray-800 font-mono text-sm relative w-full h-full flex flex-col">
                            
                            <!-- CABEÇALHO DO CUPOM -->
                            <div class="text-center mb-4 border-b border-dashed border-gray-400 pb-4">
                                <h3 class="text-xl font-bold uppercase tracking-widest">PizzaOS</h3>
                                <p class="text-xs">Rua das Pizzas, 123 - Centro</p>
                                <p class="text-xs">CNPJ: 00.000.000/0001-00</p>
                                <p class="text-xs mt-2 font-bold">*** CUPOM NÃO FISCAL ***</p>
                            </div>
                            
                            <!-- DADOS DO PEDIDO -->
                            <div class="mb-4 text-xs space-y-1">
                                <div class="flex justify-between">
                                    <span>PEDIDO:</span>
                                    <span class="font-bold text-lg">#${order.id}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>DATA:</span>
                                    <span>${new Date().toLocaleDateString()} ${order.time}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>TIPO:</span>
                                    <span class="font-bold">${order.type === 'delivery' ? 'DELIVERY' : 'BALCÃO'}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>ATENDENTE:</span>
                                    <span>${order.attendant.toUpperCase()}</span>
                                </div>
                                <div class="border-t border-dashed border-gray-300 my-2 pt-2">
                                    <span class="block font-bold">CLIENTE:</span>
                                    <span class="block truncate">${order.customer.name.toUpperCase()}</span>
                                    <span class="block">${order.customer.phone}</span>
                                    ${order.address ? `<span class="block mt-1 italic">${order.address}</span>` : ''}
                                </div>
                            </div>

                            <!-- ITENS -->
                            <table class="w-full mb-4 text-xs">
                                <thead>
                                    <tr class="border-b border-dashed border-gray-400">
                                        <th class="text-left w-8">Qtd</th>
                                        <th class="text-left">Item</th>
                                        <th class="text-right w-16">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${order.items.map(i => `
                                        <tr>
                                            <td class="py-1 align-top">${i.qty}</td>
                                            <td class="align-top">${i.name}</td>
                                            <td class="text-right align-top">${(i.price * i.qty).toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>

                            <!-- TOTAIS -->
                            <div class="border-t border-dashed border-gray-400 pt-2 mb-6 mt-auto">
                                <div class="flex justify-between font-bold text-lg">
                                    <span>TOTAL A PAGAR</span>
                                    <span>R$ ${order.total.toFixed(2)}</span>
                                </div>
                                <div class="flex justify-between text-xs mt-2">
                                    <span>FORMA PAGAMENTO:</span>
                                    <span class="font-bold">${payMap[order.payment]}</span>
                                </div>
                            </div>
                            
                            <div class="text-center text-xs mt-4">
                                <p>*** OBRIGADO PELA PREFERÊNCIA ***</p>
                                <p>Volte Sempre!</p>
                            </div>

                            <!-- Efeito de rasgo de papel (Apenas Visual) -->
                            <div class="receipt-tear absolute bottom-[-20px] left-0 w-full bg-yellow-50"></div>
                        </div>
                        
                        <!-- BOTÕES DE AÇÃO (Ocultos na Impressão) -->
                        <div class="p-4 bg-gray-100 rounded-b-lg flex flex-col gap-2 no-print border-t">
                             <button onclick="window.print()" class="w-full bg-gray-800 hover:bg-black text-white font-bold py-3 rounded flex items-center justify-center gap-2">
                                <i class="fa-solid fa-print"></i> IMPRIMIR COMPROVANTE
                             </button>
                             <button onclick="app.checkoutLogic.finishOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded flex items-center justify-center gap-2">
                                <i class="fa-solid fa-check"></i> NOVO PEDIDO / FECHAR
                             </button>
                        </div>
                    `;
                    modal.classList.remove('hidden');
                }
            },

            kdsLogic: {
                init() {
                    this.renderBoard();
                    this.interval = setInterval(() => this.renderBoard(), 5000);
                },
                renderBoard() {
                    const orders = DB.getOrders().filter(o => o.status !== 'done');
                    const cols = {
                        received: document.getElementById('col-received'),
                        prep: document.getElementById('col-prep'),
                        ready: document.getElementById('col-ready')
                    };
                    if(!cols.received) return clearInterval(this.interval);
                    Object.values(cols).forEach(el => el.innerHTML = '');
                    const counts = { received: 0, prep: 0, ready: 0 };
                    orders.forEach(order => {
                        const card = document.createElement('div');
                        card.className = "bg-white p-3 rounded shadow border-l-4 " + 
                            (order.status === 'received' ? 'border-gray-500' : 
                             order.status === 'prep' ? 'border-yellow-500' : 'border-green-500');
                        card.innerHTML = `
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-lg">#${order.id}</span>
                                <span class="text-xs text-gray-500">${order.time}</span>
                            </div>
                            <div class="mb-2 text-sm">
                                <p class="font-semibold">${order.customer.name}</p>
                                <p class="text-xs ${order.type === 'delivery' ? 'text-blue-600' : 'text-orange-600'} font-bold uppercase">${order.type}</p>
                            </div>
                            <div class="border-t border-b py-2 mb-2 text-sm space-y-1 bg-gray-50 p-1 rounded">
                                ${order.items.map(i => `<div class="flex justify-between"><span>${i.qty}x ${i.name}</span></div>`).join('')}
                            </div>
                            <div class="flex gap-1 mt-2">
                                ${order.status !== 'received' ? `<button onclick="app.kdsLogic.move(${order.id}, -1)" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 rounded text-xs"><i class="fa-solid fa-arrow-left"></i></button>` : ''}
                                ${order.status !== 'ready' ? `<button onclick="app.kdsLogic.move(${order.id}, 1)" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white py-1 rounded text-xs">Avançar <i class="fa-solid fa-arrow-right"></i></button>` : 
                                `<button onclick="app.kdsLogic.finish(${order.id})" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-1 rounded text-xs">Concluir <i class="fa-solid fa-check"></i></button>`}
                            </div>
                        `;
                        if(cols[order.status]) {
                            cols[order.status].appendChild(card);
                            counts[order.status]++;
                        }
                    });
                    const cR = document.getElementById('count-received'); if(cR) cR.innerText = counts.received;
                    const cP = document.getElementById('count-prep'); if(cP) cP.innerText = counts.prep;
                    const cRe = document.getElementById('count-ready'); if(cRe) cRe.innerText = counts.ready;
                },
                move(id, dir) {
                    const order = DB.getOrders().find(o => o.id === id);
                    const states = ['received', 'prep', 'ready'];
                    let currIdx = states.indexOf(order.status);
                    let newIdx = currIdx + dir;
                    if(newIdx >= 0 && newIdx < states.length) {
                        DB.updateOrderStatus(id, states[newIdx]);
                        this.renderBoard();
                    }
                },
                finish(id) {
                    if(confirm('Finalizar pedido e remover da tela?')) {
                        DB.updateOrderStatus(id, 'done');
                        this.renderBoard();
                    }
                }
            },

            adminLogic: {
                activeTab: 'products',
                init() {},
                switchTab(tab) {
                    this.activeTab = tab;
                    app.router.go('admin');
                },
                // Settings Logic
                togglePixMode(mode) {
                    if (mode === 'manual') {
                        document.getElementById('pix-manual-config').classList.remove('hidden');
                        document.getElementById('pix-api-config').classList.add('hidden');
                    } else {
                        document.getElementById('pix-manual-config').classList.add('hidden');
                        document.getElementById('pix-api-config').classList.remove('hidden');
                    }
                },
                saveSettings(e) {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const settings = {
                        methods: {
                            cash: formData.get('method_cash') === 'on',
                            card: formData.get('method_card') === 'on',
                            pix: formData.get('method_pix') === 'on',
                            crypto: formData.get('method_crypto') === 'on',
                        },
                        gateway: {
                            provider: formData.get('gateway_provider'),
                            publicKey: formData.get('gateway_public'),
                            secretKey: formData.get('gateway_secret'),
                        },
                        pix: {
                            mode: formData.get('pix_mode'),
                            key: formData.get('pix_key'),
                            apiKey: formData.get('pix_api_key'),
                            apiSecret: formData.get('pix_api_secret')
                        },
                        crypto: {
                            wallet: formData.get('crypto_wallet')
                        }
                    };
                    DB.saveSettings(settings);
                    alert('Configurações salvas com sucesso!');
                },
                // Products
                handleImageUpload(e) {
                    const file = e.target.files[0];
                    if(file) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            document.getElementById('prod-image-file').value = reader.result;
                            alert('Imagem carregada! Não esqueça de Salvar.');
                        };
                        reader.readAsDataURL(file);
                    }
                },
                saveProduct(e) {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const product = {
                        id: formData.get('id'),
                        name: formData.get('name'),
                        price: parseFloat(formData.get('price')),
                        category: formData.get('category'),
                        stock: formData.get('stock') ? parseInt(formData.get('stock')) : 0,
                        desc: formData.get('desc'),
                        // Use base64 file if present, else use URL input
                        image: formData.get('imageFile') || formData.get('imageUrl')
                    };
                    DB.saveProduct(product);
                    app.router.go('admin');
                    alert('Produto salvo com sucesso!');
                },
                deleteProduct(id) {
                    if(confirm('Tem certeza que deseja excluir este produto?')) {
                        DB.deleteProduct(id);
                        app.router.go('admin');
                    }
                },
                editProduct(id) {
                    const product = DB.getProducts().find(p => p.id === id);
                    if(product) {
                        document.getElementById('form-product-title').innerText = 'Editar Produto (ID: ' + id + ')';
                        document.getElementById('prod-id').value = product.id;
                        document.getElementById('prod-name').value = product.name;
                        document.getElementById('prod-price').value = product.price;
                        document.getElementById('prod-category').value = product.category;
                        document.getElementById('prod-stock').value = product.stock || '';
                        document.getElementById('prod-desc').value = product.desc;
                        document.getElementById('prod-image-url').value = product.image.startsWith('data:') ? '' : product.image;
                        document.getElementById('prod-image-file').value = product.image.startsWith('data:') ? product.image : '';
                        window.scrollTo(0, 0);
                    }
                },
                resetForm() {
                    document.getElementById('product-form').reset();
                    document.getElementById('prod-id').value = '';
                    document.getElementById('prod-image-file').value = '';
                    document.getElementById('form-product-title').innerText = 'Adicionar Novo Produto';
                },
                // Employees
                saveEmployee(e) {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const emp = {
                        id: formData.get('id'),
                        name: formData.get('name'),
                        pin: formData.get('pin'),
                        role: formData.get('role')
                    };
                    DB.saveEmployee(emp);
                    app.router.go('admin');
                    alert('Funcionário salvo!');
                },
                deleteEmployee(id) {
                    if(confirm('Remover funcionário?')) {
                        DB.deleteEmployee(id);
                        app.router.go('admin');
                    }
                },
                editEmployee(id) {
                    const emp = DB.getEmployees().find(e => e.id === id);
                    if(emp) {
                         document.getElementById('form-employee-title').innerText = 'Editar Funcionário';
                         document.getElementById('emp-id').value = emp.id;
                         document.getElementById('emp-name').value = emp.name;
                         document.getElementById('emp-pin').value = emp.pin;
                         document.getElementById('emp-role').value = emp.role;
                         window.scrollTo(0,0);
                    }
                },
                resetEmpForm() {
                    document.getElementById('employee-form').reset();
                    document.getElementById('emp-id').value = '';
                    document.getElementById('form-employee-title').innerText = 'Cadastrar Funcionário';
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
